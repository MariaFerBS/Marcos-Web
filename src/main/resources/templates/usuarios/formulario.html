
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Nuevo Usuario')}"></head>

<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="d-flex">

    <div th:replace="~{fragments/layout :: sidebar('usuarios')}"></div>

    <main class="flex-grow-1 p-4">

        <h2 class="mb-4">
            <i class="bi bi-person-plus-fill"></i>
            Registrar Nuevo Usuario
        </h2>

        <div class="card shadow-sm" style="max-width:650px;">

            <div class="card-header bg-dark text-white">
                Datos del usuario
            </div>

            <div class="card-body">

                <div th:if="${error}"
                     class="alert alert-danger"
                     th:text="${error}">
                </div>

                <form th:action="@{/usuarios/guardar}"
                      method="post">

                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text"
                               name="nombre"
                               class="form-control"
                               maxlength="100"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo o usuario</label>
                        <input type="text"
                               name="email"
                               class="form-control"
                               maxlength="50"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password"
                               name="password"
                               class="form-control"
                               minlength="12"
                               required>
                        <small class="text-muted">
                            Mínimo 12 caracteres.
                        </small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select name="rol"
                                class="form-select"
                                required>
                            <option value="">Seleccione un rol</option>
                            <option value="ADMIN">Administrador</option>
                            <option value="VENDEDOR">Vendedor</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">

                        <button type="submit"
                                class="btn btn-success">
                            <i class="bi bi-save"></i>
                            Guardar Usuario
                        </button>

                        <a th:href="@{/usuarios}"
                           class="btn btn-secondary">
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>

</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
