
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Iniciar Sesión | Sistema de Inventario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet"/>

    <style>
        body {
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .login-icon {
            width: 65px;
            height: 65px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #0d6efd;
        }
    </style>
</head>

<body>

<div class="card login-card p-4 bg-white border-0">

    <!-- ENCABEZADO -->
    <div class="text-center mb-4">

        <div class="bg-primary text-white rounded-circle mb-2 login-icon">
            <i class="bi bi-box-seam fs-2"></i>
        </div>

        <h4 class="fw-bold mb-1">SISTEMA DE INVENTARIO</h4>

        <p class="text-muted small">Iniciar sesión</p>

    </div>

    <!-- MENSAJE DE ERROR -->
    <div th:if="${param.error}"
         class="alert alert-danger py-2 small"
         role="alert">
        <i class="bi bi-exclamation-circle me-1"></i>
        Correo electrónico o contraseña incorrectos.
    </div>

    <!-- MENSAJE DE CIERRE DE SESIÓN -->
    <div th:if="${param.logout}"
         class="alert alert-success py-2 small"
         role="alert">
        <i class="bi bi-check-circle me-1"></i>
        Sesión cerrada correctamente.
    </div>

    <!-- MENSAJE INFORMATIVO -->
    <div th:if="${msg}"
         class="alert alert-info py-2 small"
         role="alert"
         th:text="${msg}">
    </div>

    <!-- FORMULARIO DE INICIO DE SESIÓN -->
    <form th:action="@{/login}" method="post">

        <!-- TOKEN CSRF -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <!-- CORREO -->
        <div class="mb-3">

            <label class="form-label small text-muted">
                Correo electrónico
            </label>

            <div class="input-group">

                <span class="input-group-text bg-light">
                    <i class="bi bi-person"></i>
                </span>

                <input
                    type="text"
                    name="email"
                    class="form-control"
                    placeholder="admin@marcos.com"
                    autocomplete="username"
                    required/>

            </div>
        </div>

        <!-- CONTRASEÑA -->
        <div class="mb-3">

            <label class="form-label small text-muted">
                Contraseña
            </label>

            <div class="input-group">

                <span class="input-group-text bg-light">
                    <i class="bi bi-lock"></i>
                </span>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Ingrese su contraseña"
                    autocomplete="current-password"
                    required/>

            </div>
        </div>

        <!-- BOTÓN INGRESAR -->
        <button type="submit"
                class="btn btn-primary w-100 py-2 fw-semibold">

            <i class="bi bi-box-arrow-in-right me-2"></i>
            Ingresar al Sistema

        </button>

    </form>

    <!-- PIE -->
    <div class="text-center mt-4">

        <small class="text-muted">
            Sistema de Gestión de Inventario
        </small>

        <br/>

        <small class="text-muted">
            © 2026 Inventario Abarrotes
        </small>

    </div>

</div>

</body>
</html>
